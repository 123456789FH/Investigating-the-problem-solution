:root{--ink:#173d39;--forest:#0d5149;--teal:#007368;--gold:#f4c35d;--paper:#f8f3e9;--line:#d7d5c6;--muted:#52685e;--pink:#a74739;--shadow:0 5px 0 #ded8c9}
*{box-sizing:border-box}body{margin:0;background-color:var(--paper);background-image:radial-gradient(#b79e6f24 .9px,transparent 1px);background-size:13px 13px;color:var(--ink);font:clamp(16px,1.35vw,21px)/1.75 ClassNoto,Tahoma,Arial,sans-serif}
h1,h2,h3,p,figure{margin:0}h1,h2,h3,.identity strong,.primary,.heroEq{font-family:ClassKufi,Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button,a,input,textarea,select{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #bc6517;outline-offset:3px}button:disabled{cursor:default;opacity:.48}
button{background:#fffdf6;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:.37em 1em;font-weight:bold}button:hover:not(:disabled){border-color:#1e7467;background:#edf7ed}button:active:not(:disabled){transform:translateY(1px)}
.shell{max-width:1240px;margin:auto;padding:0 clamp(16px,4vw,60px)}.mast,.identity,.tools,.navigation,.inline,.dhead,.topline,.timerBar,.toolLabel{display:flex;align-items:center}.mast{justify-content:space-between;gap:12px;padding:19px 0 14px}.identity{gap:12px}.identity img{width:55px;height:55px;object-fit:contain}.identity strong,.identity small{display:block}.identity strong{font-size:22px;line-height:1.6}.identity small{color:var(--muted);font-size:13px}.tools{gap:6px}.tools button{font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px}.icon{width:19px;height:19px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

function stateFor(key){

}

const wrap=(content,extra="")=>`<section class="screen ${extra}">${content}</section>`;
function mathSteps(q){return q.maths?`<div class="worked">${q.maths.map(eq).join("")}</div>`:"";}
function fb(k){const s=stateFor(k),q=custom[k];return `<div class="feedback ${s.tone}" role="status">${s.msg}${s.done?mathSteps(q):""}</div>${s.tried&&!s.done&&!q.open?`<button class="modelButton" data-model="${k}" aria-expanded="${s.model}">${s.model?"إخفاء الحلّ":"شاهدي خطوات الحلّ"}</button>`:""}${s.model?`<div class="feedback model"><b>حلّ ممكن</b><p>${q.explain}</p>${mathSteps(q)}</div>`:""}`;}
function numeric(k,labelled=true){
 const s=stateFor(k),q=custom[k], fields=q.fields||[[q.unit?("العدد ("+q.unit+")"):"الناتج",q.answer]];
 return `<form data-form="${k}">${q.options2?`<div class="choices" role="group" aria-label="المقارنة">${q.options2.map((t,i)=>`<button class="subchoice" type="button" data-select="${i}" data-for="${k}" aria-pressed="${s.choice===i}" ${s.done?"disabled":""}>${t}</button>`).join("")}</div>`:""}<div class="actions">${fields.map(([t],i)=>`<label><span class="fieldLabel">${labelled?t:"الناتج"}</span><input class="answer" data-k="${k}" data-i="${i}" inputmode="numeric" maxlength="8" autocomplete="off" value="${esc(s.values[i]??"")}" ${s.done?"readonly":""}></label>`).join("")}<button class="primary" ${s.done?"disabled":""}>تحقّقي</button></div></form>${fb(k)}`;
}

function nafes(){
 const k="nafes",q=custom[k],s=stateFor(k);
 return wrap(header("مراجعة · تدريب يحاكي نافس","أختار ثم أظلّل")+ `<div class="lessonGrid"><div class="work"><p class="question">${q.prompt}</p><ol class="optionList">${q.options.map((v,i)=>`<li><b class="letter">${letters[i]}</b>${v}</li>`).join("")}</ol></div><div class="tile ochre"><h3>نموذج التظليل</h3><p>ظلّلي دائرة واحدة ثم تحقّقي.</p><div class="bubbleSheet">${letters.map((l,i)=>`<button data-shade="${i}" aria-pressed="${s.choice===i}" aria-label="تظليل ${l}" ${s.done?"disabled":""}>${l}</button>`).join("")}</div><div class="actions"><button class="primary" data-checkshade ${s.done?"disabled":""}>تحقّقي من التظليل</button></div>${fb(k)}</div></div>`);
}
function goals(){return wrap(header("فكرة الدرس","أختار خطةً مناسبة لأحلّ المسألة",false)+`<div class="grid2"><div class="tile mint"><h3>أهداف التعلّم</h3><ul class="info-lines"><li>أحدّد المعطيات والمطلوب.</li><li>أختار التمثيل أو الرسم أو البحث عن نمط، وأبيّن سبب اختياري.</li><li>أحلّ المسألة، ثم أتحقّق بطريقة أخرى.</li></ul></div><div class="tile ochre"><h3>مفردات أستعملها</h3><p><b>المعطيات</b> هي المعلومات التي أعرفها.</p><p><b>المطلوب</b> ما أريد إيجاده.</p><p><b>الخطة</b> الطريقة التي سأستعملها للوصول إلى الحلّ.</p></div></div><details class="strategy"><summary>كيف نعمل معًا؟</summary><p>تفكّر كل طالبة في خطة، ثم ترسمها مع زميلتها. تعرض إحداهما الحل، وتشرح الأخرى كيف تحقّقت منه.</p></details>`);}
const stepNames=["أفهم","أخطّط","أحلّ","أتحقّق"];
function trip(){
 const s=stateFor("trip");
 const views=[
 `<h3>ماذا أعرف؟ وما المطلوب؟</h3><ul class="info-lines"><li>عدد الحافظات ٦.</li><li>في كل حافظة ٥ وجبات.</li><li>أبحث عن عدد الوجبات كلّها.</li></ul>`,
 `<h3>أرسم صورة</h3><p>أرسم مستطيلًا لكل حافظة، وأضع فيه خمس نقاط. يمثّل كل مستطيل مجموعة متساوية العدد.</p><p class="subtle support">يمكن أيضًا أن أعدّ بالخمسات، أو أمثّل الوجبات بقطع العدّ.</p>`,
 `<h3>أحوّل الصورة إلى جملة ضرب</h3><p class="question">${custom.trip.prompt}</p><div class="bigmath">${eq("6 × 5 = □")}</div>${numeric("trip")}`,
 s.tried?`<h3>أتحقّق بالجمع المتكرر</h3><p>أجمع خمس وجبات ستّ مرّات، ثم أقارن ناتج الجمع بناتج الضرب.</p><div class="worked">${eq("5 + 5 + 5 + 5 + 5 + 5 = 30")}</div><p class="support">تساوى الناتجان، إذن يحمل ماهر ٣٠ وجبة.</p>`:`<h3>أتحقّق بطريقة أخرى</h3><p>جرّبي حلّ المسألة أولًا، ثم قارني إجابتكِ بالجمع المتكرّر.</p><button class="secondary support" data-step="2">انتقلي إلى «أحلّ»</button>`];
 return wrap(header("مثال الكتاب","كم وجبة سيأخذ ماهر؟")+ `<p class="trip-context">يذهب ماهر مع أستاذه وزملائه في رحلة. معهم ٦ حافظات للطعام، في كل حافظة ٥ وجبات. كم وجبةً في الحافظات الست؟</p><div class="tabs" role="group" aria-label="خطوات الحل">${stepNames.map((t,i)=>`<button class="trip-tab" data-step="${i}" aria-current="${i===step}">${ar(i+1)} · ${t}</button>`).join("")}</div><div class="lessonGrid"><div class="work trip-active">${views[step]}</div><figure class="diagram"><h3>صورة المسألة</h3>${trays(5)}<figcaption>كل مستطيل حافظة، وكل نقطة وجبة.</figcaption></figure></div>`);}

function writing(){
 const k="write",s=stateFor(k);return `<label class="fieldLabel" for="mywords">اكتبي خطواتكِ بكلماتكِ.</label><textarea id="mywords" data-note="${k}" placeholder="بدأتُ بـ… ثم…">${esc(s.note)}</textarea><button class="secondary" data-compare>قارني بنموذج الإجابة</button>${fb(k)}`;
}
function choosePlan(k){
 const s=stateFor(k),plans=["أمثّلها","أرسم صورة","أبحث عن نمط"];
 return `<div class="strategy"><b>أيّ خطة تودّين تجربتها؟</b><div class="choices">${plans.map((v,i)=>`<button type="button" class="subchoice" data-plan="${i}" data-for="${k}" aria-pressed="${s.plan===i}">${v}</button>`).join("")}</div>${s.plan===undefined?"":`<p role="status">${planPrompts[k][s.plan]}</p>`}</div>`;
}
function book(){
 const [k,title,cue,image]=books[current-4],q=custom[k];return wrap(header("أحلّ مسائل متنوّعة · سؤال الكتاب "+ar(current-3),title)+`<div class="lessonGrid"><div class="work qbody"><p class="question">${q.prompt}</p>${q.open?writing():choosePlan(k)+numeric(k)}<details class="strategy"><summary>فكّري في الخطة</summary><p>${cue}</p></details></div><figure class="diagram">${media(image)}</figure></div>`);
}
function golden(){return wrap(header("مهارات التفكير العليا","السؤال الذهبي")+ `<div class="lessonGrid"><div class="work"><p class="question">${custom.gold.prompt}</p>${numeric("gold")}</div><div class="tile ochre"><h3>ارسمي قبل الحساب</h3><p>ارسمي الحافظات الست على ورقة. ميّزي الفارغة وذات الوجبة الواحدة، ثم املئي الباقي.</p><p class="subtle">اشرحي لزميلتكِ أين استعملتِ الصفر والواحد في خطتكِ.</p></div></div>`,"gold");}
function recap(){return wrap(header("ملخّص الدرس","كيف أختار خطةً وأتأكّد من حلّي؟",false)+`<ol class="steps-list">${stepNames.map((t,i)=>`<li><h3>${t}</h3><p>${["ما المعلومات التي أملكها؟ وما المطلوب؟","أمثّل، أو أرسم صورة، أو أبحث عن نمط يناسب المسألة.","أطبّق خطتي، ثم أكتب الناتج مع وحدته.","أراجع الرسم أو أعيد الحساب بطريقة أخرى."][i]}</p></li>`).join("")}</ol><div class="tile mint"><h3>من رحلة ماهر</h3><p>أظهرت الصورة ستّ مجموعات متساوية، ومكّننا العدّ بالخمسات من مراجعة الناتج.</p><div class="worked">${eq("6 × 5 = 30")}</div></div>`);}
function exitCard(){return wrap(header("تقويم ختامي","بطاقة الخروج")+ `<div class="lessonGrid"><div class="work"><p class="question">${custom.exit.prompt}</p>${numeric("exit")}</div><div class="tile mint"><h3>كيف تحقّقتِ؟</h3><label for="exitNote" class="fieldLabel">اكتبي جملة تشرحين فيها طريقتكِ.</label><textarea id="exitNote" data-note="exit" placeholder="تحقّقتُ من إجابتي عندما…">${esc(stateFor("exit").note)}</textarea></div></div>`);}
function feelings(){const a=[["😊","أحلّ وأشرح خطتي"],["🤔","أحتاج إلى تدريب"],["🙋‍♀️","أرغب في المساعدة"]];return wrap(header("ختام الحصة","كيف تشعرين بعد حلّ المسائل؟",false)+`<div class="choices moods">${a.map(([e,t])=>`<button data-mood="${t}" aria-pressed="${mood===t}" class="${mood===t?"picked":""}"><b>${e}</b>${t}</button>`).join("")}</div>${mood?`<p role="status" class="feedback good">شكرًا لمشاركتكِ شعوركِ. ${mood==="أحلّ وأشرح خطتي"?"اختاري مسألة واشرحي لزميلتكِ كيف تحقّقتِ منها.":mood==="أحتاج إلى تدريب"?"عودي إلى مسألة السيارات وجرّبي جمع عددين يسهل جمعهما أولًا.":"اطلبي من معلّمتكِ أن ترسم معكِ الحافظات خطوةً خطوة."}</p>`:""}`);}
function updateThemeButton(){
 const dark=document.documentElement.dataset.theme==="dark";
 const btn=el("theme");
 btn.innerHTML=icon(dark?"sun":"moon")+(dark?"نهاري":"ليلي");
 btn.setAttribute("aria-label",dark?"تفعيل الوضع النهاري":"تفعيل الوضع الليلي");
 btn.title=btn.getAttribute("aria-label");
}
function toggleTheme(){
 chosenTheme=document.documentElement.dataset.theme==="dark"?"light":"dark";
 try { localStorage.setItem(themeKey,chosenTheme); } catch {}
 applyTheme();
 updateThemeButton();
}

function stopClock(){if(interval!==null) clearInterval(interval);interval=null;}
function displayTime(){
 const o=el("time");if(!o)return;
 o.textContent=ar(Math.floor(remaining/60)+":"+String(remaining%60).padStart(2,"0"));
 el("timeToggle").textContent=interval!==null?"إيقاف مؤقت":remaining===0?"تشغيل جديد":remaining===(limits[current]||60)?"ابدئي المؤقّت":"استئناف";
 o.parentElement.classList.toggle("timedOut",remaining===0);
}
function resetTime(){stopClock();remaining=limits[current]||60;displayTime();}
function toggleClock(){
 if(interval!==null){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stopClock();displayTime();return;}
 if(remaining===0) remaining=limits[current]||60;
 deadline=Date.now()+remaining*1000;
 interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remaining===0){stopClock();el("announce").textContent="انتهى وقت النشاط.";}displayTime();},200);
 displayTime();
}
function setSound(){
 el("sound").innerHTML=icon(soundOn?"sound":"mute")+(soundOn?"الصوت":"مكتوم");el("sound").setAttribute("aria-pressed",soundOn);el("sound").title=soundOn?"كتم صوت التصفيق":"تشغيل صوت التصفيق";if(!soundOn){el("claps").pause();el("claps").currentTime=0;}
}
function celebrate(key){
 if(awards.has(key))return;awards.add(key);
 if(soundOn){const clip=el("claps");clip.currentTime=0;clip.volume=.82;const play=clip.play();if(play) play.catch(()=>{});}
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 for(let j=0;j<18;j++){const star=document.createElement("span");star.className="spark";star.textContent=j%2?"✦":"★";star.style.left=(26+Math.random()*49)+"%";star.style.top=(32+Math.random()*32)+"%";star.style.setProperty("--dx",(Math.random()-.5)*295+"px");star.style.setProperty("--dy",(-37-Math.random()*125)+"px");el("stars").appendChild(star);setTimeout(()=>star.remove(),1400);}
}
function render(){
 const screens=[warm,nafes,goals,trip,book,book,book,book,book,book,golden,recap,exitCard,feelings];
 el("main").innerHTML=screens[current]();
 el("prev").disabled=current===0;
 el("next").innerHTML=(current===chapters.length-1?"بداية الدرس":"التالي")+icon("next");
 el("position").textContent=ar(current+1)+" من "+ar(chapters.length)+"   ·   ★ "+ar(awards.size);
 el("progress").style.width=((current+1)/chapters.length*100)+"%";
 displayTime();
}
function go(n){if(n<0||n>=chapters.length)return;current=n;resetTime();render();window.scrollTo(0,0);el("main").focus({preventScroll:true});}
function mark(k,correct){
 const s=stateFor(k),q=custom[k];s.tried=true;s.done=correct;s.model=false;s.tone=correct?"good":"hint";s.msg=correct?"★ "+q.explain:q.hint;
 if(correct)celebrate(k);render();
}
function notice(k,t){const s=stateFor(k);s.tone="hint";s.msg=t;render();}
function refreshButton(sel){render();el("main").querySelector(sel)?.focus({preventScroll:true});}
function handleMain(e){
 const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.id==="timeToggle"){toggleClock();return;}
 if(b.id==="timeReset"){resetTime();return;}
 if(b.hasAttribute("data-warm")){warmFill=Number(b.dataset.warm);refreshButton('[data-warm="'+warmFill+'"]');return;}
 if(b.hasAttribute("data-step")){step=Number(b.dataset.step);refreshButton('[data-step="'+step+'"]');return;}
 if(b.hasAttribute("data-shade")){const s=stateFor("nafes");s.choice=Number(b.dataset.shade);s.msg="";s.tone="";s.model=false;refreshButton('[data-shade="'+s.choice+'"]');return;}
 if(b.hasAttribute("data-checkshade")){const s=stateFor("nafes");if(s.choice===null)notice("nafes","ظلّلي دائرة واحدة أولًا.");else mark("nafes",s.choice===custom.nafes.right);return;}
 if(b.hasAttribute("data-model")){const s=stateFor(b.dataset.model);s.model=!s.model;refreshButton('[data-model="'+b.dataset.model+'"]');return;}
 if(b.hasAttribute("data-plan")){const s=stateFor(b.dataset.for);s.plan=Number(b.dataset.plan);refreshButton('[data-plan="'+s.plan+'"]');return;}
 if(b.hasAttribute("data-select")){const s=stateFor(b.dataset.for);s.choice=Number(b.dataset.select);refreshButton('[data-select="'+s.choice+'"]');return;}
 if(b.hasAttribute("data-compare")){const s=stateFor("write");if(!s.note.trim())notice("write","اكتبي تفسيركِ أولًا، ثم قارنيه بالنموذج.");else{s.model=true;s.tone="";s.msg="";render();}return;}
 if(b.hasAttribute("data-mood")){mood=b.dataset.mood;refreshButton('[data-mood="'+mood+'"]');}
}
function onSubmit(e){
 const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
 const k=f.dataset.form,q=custom[k],s=stateFor(k);if(s.done)return;
 s.values=[...f.querySelectorAll("input")].map(i=>i.value);
 const vs=s.values.map(latin);
 if(vs.some(v=>!/^\d+$/.test(v))){notice(k,"اكتبي عددًا في كل خانة، ثم تحقّقي.");return;}
 if(q.options2&&s.choice===null){notice(k,"اختاري عبارة المقارنة ثم تحقّقي.");return;}
 const fields=q.fields||[["",q.answer]];
 mark(k,vs.every((v,i)=>Number(v)===fields[i][1])&&(!q.options2||s.choice===q.decision));
}
function openDialog(title,body){el("dtitle").textContent=title;el("dbody").innerHTML=body;if(!el("popup").open)el("popup").showModal();}
function mapDialog(){openDialog("خريطة الدرس",`<div class="mapGrid">${chapters.map((t,i)=>`<button data-route="${i}" aria-current="${i===current}"><b>${ar(i+1)}</b> ${t}</button>`).join("")}</div><p class="subtle">مسألة ماهر والأسئلة ١–٦ من درس «استقصاء حلّ المسألة» في كتاب الرياضيات للصف الثالث، وترافقها أنشطة للمراجعة والتقويم.</p><div class="actions"><button id="restart">بدء حصة جديدة</button></div>`);}
document.addEventListener("DOMContentLoaded",()=>{
 updateThemeButton();el("theme").onclick=toggleTheme;systemTheme.addEventListener("change",()=>{applyTheme();updateThemeButton();});
 el("prev").innerHTML=icon("back")+"السابق";el("mapOpen").innerHTML=icon("map")+"الخريطة";el("mapOpen").onclick=mapDialog;
 el("close").onclick=()=>el("popup").close();el("sound").onclick=()=>{soundOn=!soundOn;setSound();};setSound();
 el("prev").onclick=()=>go(current-1);el("next").onclick=()=>go((current+1)%chapters.length);
 el("main").addEventListener("click",handleMain);el("main").addEventListener("submit",onSubmit);
 el("main").addEventListener("input",e=>{const t=e.target;if(t.hasAttribute("data-k"))stateFor(t.dataset.k).values[Number(t.dataset.i)]=t.value;if(t.hasAttribute("data-note"))stateFor(t.dataset.note).note=t.value;});
 el("dbody").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-route")){el("popup").close();go(Number(b.dataset.route));}
 else if(b.id==="restart")openDialog("بدء حصة جديدة",`<p>هل تريدين مسح الإجابات والنجوم وبدء الحصة من جديد؟</p><div class="actions"><button id="confirmRestart" class="primary">ابدئي من جديد</button><button id="keep">عودة للخريطة</button></div>`);
 else if(b.id==="keep")mapDialog();else if(b.id==="confirmRestart"){answers.clear();awards.clear();warmFill=0;step=0;mood="";el("claps").pause();el("popup").close();go(0);}
 });
 document.addEventListener("keydown",e=>{if(el("popup").open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest("input,textarea,select,button,summary"))return;
 if(e.key==="ArrowLeft"&&current<chapters.length-1){e.preventDefault();go(current+1);}else if(e.key==="ArrowRight"&&current>0){e.preventDefault();go(current-1);}
 });resetTime();render();
});

</script>
